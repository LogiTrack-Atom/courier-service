server:
  port: ${COURIER_SERVER_PORT:8081}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
spring:
  config:
    activate:
      on-profile: (local | test) & !dev & !prod
  cloud:
    config:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
logitrack:
  config:
    marker: courier-service-local
  security:
    issuer: ${JWT_ISSUER:logitrack-security}
    audience: ${JWT_AUDIENCE:logitrack-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    clock-skew: ${JWT_CLOCK_SKEW:60s}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
clients:
  security:
    base-url: ${SECURITY_SERVICE_URL:http://localhost:8082}
    connect-timeout: ${SECURITY_CONNECT_TIMEOUT:2s}
    read-timeout: ${SECURITY_READ_TIMEOUT:3s}
